<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <link href="./style.css" rel="stylesheet"/>
    <title> Démons et Merveilles</title>
</head>

<body class="bgmed">

<div class="menu">
    <img id="logo" src="./images/demPNG.png" alt="Logo Démons et Merveilles">
    <br/>
</div>
<div class="menu">
    Démons & Merveilles
</div>

<div id="page-content">
    <div class="card-container notprinted">
        <!-- Les cartes seront générées ici -->
        <div class="cardDouble invite notprinted">
            <div class="card-content">
                <span class="card-title">
                    <label for="selectToPrint"> Selectionnez votre JDR </label>
                </span>
                <span class="card-mastering" style="margin-top:20px;">
                <select id="selectToPrint" style="width:60vw" class="select">
                    <option selected value="-1"> - - - </option>
                </select>
                </span>
                <span class="card-mastering" style="margin-top:20px;">
                    <button onclick="window.print()" class="button">🖨️ Imprimer</button>
                </span>
            </div>
        </div>
    </div>
    <div class="card-container" id="cardToPrint">
        <!-- Les cartes seront générées ici -->
    </div>
</div>
</body>
<footer>
    <!-- jQuery servi depuis un CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        /*************************************/
        /*      Chargement des JDRS 	     */
        /*************************************/

        let cardsData = [];

        // Quand l'utilisateur choisit un JDR dans la liste déroulante
        $('#selectToPrint').on('change', function () {
            const selectedId = $(this).val();

            if (selectedId !== '-1') {
                generateCard(selectedId);
            } else {
                $('#cardToPrint').html('<p>Aucune carte sélectionnée.</p>');
            }
        });

        $(function () {
            // Charge la liste des JDRs et remplit le menu déroulant
            $.getJSON('data/jdr.json')
                .done(function (data) {
                    cardsData = data;
                    console.log('Cartes chargées');

                    data.forEach(function (card) {
                        if (card.type === 'jdr') {
                            const $option = $('<option>')
                                .val(card.id)
                                .text(card.title + ' (' + card.mastering + ')');
                            $('#selectToPrint').append($option);
                        }
                    });
                })
                .fail(function (jqXHR) {
                    console.error('Impossible de charger les cartes :', jqXHR.status, jqXHR.statusText);
                });
        });

        // Gabarit HTML d'une carte de JDR (version impression, sans lien)
        const cardTemplate = `
<div class="card%cardsize% %cardtype%">
    <div class="card-image-container">
        <img class="card-image" src="%urlimage%" alt="Logo du JDR">
    </div>

    <hr class="card-hr"/>
    <div class="card-content">
        <span class="card-title">%title%</span>
        <span class="card-description">%description%</span>
        <span class="card-mastering">
        <h3> %mastering% </h3>
      </span>
    </div>
</div>
`;

        // Construit et affiche la carte imprimable correspondant à l'id choisi
        function generateCard(cardId) {
            const $container = $('#cardToPrint');
            if ($container.length === 0) {
                console.error('Élément #cardToPrint introuvable dans le DOM !');
                return;
            }

            const card = cardsData.find(function (c) {
                return c.id === parseInt(cardId, 10);
            });

            if (!card) {
                console.error(`Carte avec l'ID ${cardId} introuvable dans les données.`);
                return;
            }

            const cardHtml = cardTemplate
                .replace('%cardsize%', '')
                .replace('%cardtype%', card.type)
                .replace('%urlimage%', card.image)
                .replace('%title%', card.title)
                .replace('%description%', card.description)
                .replace('%mastering%', card.type === 'jdr' ? 'Masterisé par ' + card.mastering : card.mastering);

            $container.html(cardHtml);
            document.title = card.title;
        }
    </script>
</footer>
</html>
