<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <link href="./style.css" rel="stylesheet"/>
    <title> Démons et Merveilles</title>
</head>

<body class="bgmed">

<div class="menu">
    <div class="menugauche">
        <div class="menu-button" onclick="loadRealPage('accueil');"> Accueil </div>
        <div class="menu-button" onclick="loadRealPage('agenda');"> Agenda</div>
        <div class="menu-button" onclick="loadRealPage('jdrs');">  JDRs et Invités </div>
    </div>

    <img id="logo" src="./images/demPNG.png" alt="Logo Démons et Merveilles">

    <div class="menudroite">
        <div class="menu-button" onclick="loadRealPage('mtg');"> Magic The Gathering</div>
        <div class="menu-button" onclick="loadRealPage('bloodbowl');"> BloodBowl</div>
        <div class="menu-button" onclick="loadRealPage('concours-peinture');"> Concours de Peinture</div>
    </div>
</div>

<div id="page-content" style="height: 100%;">
</div>
</body>
<footer>
    <!-- jQuery servi depuis un CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>

        // Charge une page (fragment HTML) dans le conteneur principal
        function loadRealPage(pageName) {
            const $content = $('#page-content');

            // Affiche le loader pendant le chargement
            $content.html(`
                <div class="loading">
                    <div class="spinner"></div>
                    Chargement de la page...
                </div>
            `);

            // Récupère le fragment HTML correspondant à la page demandée
            $.get(`./pages/${pageName}.html`)
                .done(function (content) {
                    $content.html(content);

                    // La page des JDRs a besoin des cartes générées dynamiquement
                    if (pageName === 'jdrs') {
                        generateCards(cardsData);
                    }
                })
                .fail(function (jqXHR) {
                    $content.html(`
                        <div class="error">
                            ❌ Erreur lors du chargement de la page "${pageName}" : ${jqXHR.status} ${jqXHR.statusText}
                        </div>
                    `);
                });
        }

        $(function () {
            loadRealPage('accueil'); // page de démarrage
            updateCountdown();
        });

        // Date cible du compte à rebours (portes ouvertes)
        const targetDate = new Date('2026-05-08T14:00:00');

        // Formate un nombre de secondes en "X JOURS / X HEURES / ..."
        function formatTime(secondsInput) {
            let seconds = secondsInput;

            const days = Math.floor(seconds / (24 * 3600));
            seconds %= 24 * 3600;

            const hours = Math.floor(seconds / 3600);
            seconds %= 3600;

            const minutes = Math.floor(seconds / 60);
            seconds %= 60;

            return `${days} JOUR${days > 1 ? 'S' : ''} \n` +
                `${hours < 10 ? '0' + hours : hours} HEURE${hours > 1 ? 'S' : ''} \n` +
                `${minutes < 10 ? '0' + minutes : minutes} MINUTE${minutes > 1 ? 'S' : ''} \n` +
                `${seconds < 10 ? '0' + seconds : seconds} SECONDE${seconds > 1 ? 'S' : ''} `;
        }

        // Met à jour l'affichage du compte à rebours, s'il est présent sur la page
        function updateCountdown() {
            const $countdown = $('#countdown');
            if ($countdown.length === 0) {
                return;
            }

            const now = new Date();
            const timeLeft = Math.floor((targetDate - now) / 1000);

            if (timeLeft > 0) {
                $countdown.text(formatTime(timeLeft));
            } else {
                $countdown.text("C'est maintenant !");
                clearInterval(timer);
            }
        }

        const timer = setInterval(updateCountdown, 1000);

        /*************************************/
        /*      Chargement des JDRS 	     */
        /*************************************/

        let cardsData = [];

        // Charge la liste des JDRs proposés depuis le fichier JSON
        $.getJSON('data/jdr.json')
            .done(function (data) {
                cardsData = data;
                console.log('✅ Cartes chargées :', cardsData);
            })
            .fail(function (jqXHR) {
                console.error('❌ Impossible de charger les cartes :', jqXHR.status, jqXHR.statusText);
            });

        // Gabarit HTML d'une carte de JDR
        const cardTemplate = `
<div class="card%cardsize% %cardtype%">
    <div class="card-image-container">
        <img class="card-image" src="%urlimage%" alt="Logo du JDR">
    </div>

    <hr class="card-hr"/>
    <div class="card-content">
        <span class="card-title">%title%</span>
        <span class="card-description">
            %description%
        </span>
        <span class="card-mastering"> 
        <h3> %mastering% <a href="%link%" style="color:lightblue"> %desclink% %link% </a> </h3>
        <h3> %horaire% </h3>
      </span>
    </div>
</div>
`;

        // Construit et injecte les cartes de JDR dans le conteneur
        function generateCards(cards) {
            const $container = $('.card-container');
            if ($container.length === 0) {
                console.error('❌ Élément .card-container introuvable dans le DOM !');
                return;
            }

            console.log('🃏 Génération des cartes...');

            const cardsHtml = cards.map(function (card) {
                return cardTemplate
                    .replace('%cardsize%', card.format === 'double' ? 'Double' : '')
                    .replace('%cardtype%', card.type ?? '')
                    .replace('%urlimage%', card.image ?? '')
                    .replace('%title%', card.title ?? '')
                    .replace('%description%', card.description ?? '')
                    .replace('%horaire%', card.horaire ?? '')
                    .replace('%mastering%', card.type === 'jdr' ? 'Masterisé par ' + card.mastering : card.mastering)
                    .replaceAll('%link%', card.link ?? '')
                    .replaceAll('%desclink%', card.desclink ?? '');
            }).join('');

            $container.html(cardsHtml);
        }
    </script>
</footer>
</html>
